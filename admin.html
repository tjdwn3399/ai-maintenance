<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMG 트러블슈팅 · 매뉴얼 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- 클라이언트 사이드 텍스트 추출 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#002C5F;--blue:#0057B8;--blue-lt:#E8F1FB;
  --red:#C0392B;--red-lt:#FDECEA;--grn:#1A7A45;--grn-lt:#E8F5EE;
  --ora:#D97706;--ora-lt:#FEF3E2;
  --bg:#F2F1ED;--card:#fff;--line:#E0DED8;--line2:#CBC9C2;
  --t1:#18170F;--t2:#4E4C46;--t3:#8A8880;--t4:#B8B5AE;
  --mono:'DM Mono',monospace;--sans:'Noto Sans KR',-apple-system,sans-serif;
  --r:8px;--rl:12px;
}
body{background:var(--bg);font-family:var(--sans);color:var(--t1);min-height:100vh}
header{background:var(--navy);height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.logo{display:flex;align-items:center;gap:12px}
.logo-badge{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:#fff;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:3px;padding:3px 9px}
.logo-title{font-size:13px;font-weight:600;color:rgba(255,255,255,.88)}
.back-btn{font-size:12px;font-weight:600;color:rgba(255,255,255,.7);text-decoration:none;padding:5px 12px;border:1px solid rgba(255,255,255,.25);border-radius:5px;transition:all .15s}
.back-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:22px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card-title{font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';display:block;width:3px;height:15px;background:var(--navy);border-radius:2px}
.card-desc{font-size:12px;color:var(--t3);margin-bottom:18px;margin-left:11px}

.upload-zone{border:2px dashed var(--line2);border-radius:var(--r);padding:36px 20px;text-align:center;transition:all .2s;cursor:pointer;position:relative}
.upload-zone:hover,.upload-zone.drag{border-color:var(--blue);background:var(--blue-lt)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:36px;opacity:.35;margin-bottom:10px}
.upload-title{font-size:15px;font-weight:600;color:var(--t2);margin-bottom:5px}
.upload-desc{font-size:12px;color:var(--t3)}
.upload-formats{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.fmt-badge{font-size:11px;font-family:var(--mono);padding:3px 8px;border-radius:3px;border:1px solid var(--line);background:#F7F6F2;color:var(--t2)}

/* 파일별 진행 상태 */
.file-progress-list{display:none;flex-direction:column;gap:8px;margin-top:14px}
.file-progress-list.show{display:flex}
.fp-item{background:#F7F6F2;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.fp-name{font-size:12px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.fp-bar-wrap{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:5px}
.fp-bar{height:100%;background:var(--blue);border-radius:3px;width:0;transition:width .3s}
.fp-bar.done{background:var(--grn)}
.fp-bar.err{background:var(--red)}
.fp-status{font-size:11px;color:var(--t3)}
.fp-status.done{color:var(--grn)}
.fp-status.err{color:var(--red)}

.msg{display:none;padding:10px 14px;border-radius:var(--r);font-size:13px;margin-top:12px}
.msg.show{display:block}
.msg.ok{background:var(--grn-lt);border:1px solid rgba(26,122,69,.25);color:var(--grn)}
.msg.err{background:var(--red-lt);border:1px solid rgba(192,57,43,.25);color:var(--red)}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:#F7F6F2;border-radius:var(--r);padding:12px 14px;text-align:center;border:1px solid var(--line)}
.stat-val{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--navy);line-height:1}
.stat-lbl{font-size:11px;color:var(--t3);margin-top:3px}

.manual-list{display:flex;flex-direction:column;gap:8px}
.manual-empty{text-align:center;padding:28px;color:var(--t3);font-size:13px}
.manual-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#F7F6F2;border-radius:var(--r);border:1px solid var(--line)}
.manual-icon{font-size:22px;flex-shrink:0}
.manual-info{flex:1;min-width:0}
.manual-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.manual-meta{font-size:11px;color:var(--t3);margin-top:2px;font-family:var(--mono)}
.btn-del{font-size:12px;font-weight:600;padding:5px 12px;border-radius:5px;border:1.5px solid var(--red);color:var(--red);background:transparent;cursor:pointer;transition:all .15s;flex-shrink:0;font-family:var(--sans)}
.btn-del:hover{background:var(--red);color:#fff}
.btn-refresh{font-size:12px;font-weight:600;padding:6px 14px;border-radius:5px;border:1px solid var(--line2);color:var(--t2);background:var(--card);cursor:pointer;font-family:var(--sans);transition:all .15s}
.btn-refresh:hover{border-color:var(--navy);color:var(--navy)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
</style>
</head>
<body>
<script>
(function(){
  if(!sessionStorage.getItem('hmg_auth')){
    location.href='/login.html';
  }
})();
</script>

<header>
  <div class="logo">
    <div class="logo-badge">HMG</div>
    <div class="logo-title">아산엔진공장 · 매뉴얼 관리</div>
  </div>
  <button onclick="if(confirm('로그아웃 하시겠습니까?')){sessionStorage.removeItem('hmg_auth');location.href='/login.html';}" style="font-size:12px;font-weight:600;color:rgba(255,255,255,.6);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:5px 12px;cursor:pointer;font-family:var(--sans);margin-right:8px">로그아웃</button>
  <a href="/" class="back-btn">← 트러블슈팅으로</a>
</header>

<div class="wrap">

  <div class="card">
    <div class="card-title">매뉴얼 업로드</div>
    <div class="card-desc">텍스트를 브라우저에서 직접 추출 후 저장합니다. 최대 20MB까지 지원.</div>

    <div class="upload-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.pptx,.ppt" multiple onchange="handleFiles(this.files)">
      <div class="upload-icon">📂</div>
      <div class="upload-title">클릭하거나 파일을 끌어다 놓으세요</div>
      <div class="upload-desc">PDF, Excel, PowerPoint 파일을 업로드할 수 있습니다</div>
      <div class="upload-formats">
        <span class="fmt-badge">PDF</span>
        <span class="fmt-badge">XLSX / XLS</span>
        <span class="fmt-badge">PPTX / PPT</span>
      </div>
    </div>

    <div class="file-progress-list" id="fpList"></div>
    <div class="msg" id="uploadMsg"></div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div class="card-title" style="margin-bottom:0">등록된 매뉴얼</div>
      <button class="btn-refresh" onclick="loadManuals()">🔄 새로고침</button>
    </div>
    <div class="card-desc" style="margin-bottom:14px">등록된 매뉴얼은 모든 AI 분석에 자동 반영됩니다.</div>
    <div class="stats-row">
      <div class="stat"><div class="stat-val" id="statCount">-</div><div class="stat-lbl">등록 파일</div></div>
      <div class="stat"><div class="stat-val" id="statText">-</div><div class="stat-lbl">추출 텍스트</div></div>
      <div class="stat"><div class="stat-val" id="statStatus">-</div><div class="stat-lbl">AI 참조 상태</div></div>
    </div>
    <div class="manual-list" id="manualList">
      <div class="manual-empty">불러오는 중...</div>
    </div>
  </div>

</div>

<script>
// PDF.js 워커 설정
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── 드래그앤드롭 ──
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});

// ── 텍스트 추출 (클라이언트 사이드) ──

async function extractPdfText(file, onProgress) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(item => item.str).join(' ') + '\n';
    onProgress(Math.round((i / pdf.numPages) * 80));
  }
  return text;
}

async function extractExcelText(file) {
  const arrayBuffer = await file.arrayBuffer();
  const workbook = XLSX.read(arrayBuffer, { type: 'array' });
  let text = '';
  workbook.SheetNames.forEach(name => {
    const csv = XLSX.utils.sheet_to_csv(workbook.Sheets[name]);
    text += `[시트: ${name}]\n${csv}\n\n`;
  });
  return text;
}

async function extractPptxText(file) {
  // PPTX = ZIP → XML 파싱으로 텍스트 추출
  const arrayBuffer = await file.arrayBuffer();
  const bytes = new Uint8Array(arrayBuffer);

  // JSZip 없이 간단하게 - UTF-8 디코딩 후 XML 태그 제거
  const text = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
  const matches = text.match(/<a:t[^>]*>([^<]+)<\/a:t>/g) || [];
  const lines = matches
    .map(m => m.replace(/<[^>]+>/g, '').trim())
    .filter(l => l.length > 1);
  return lines.join('\n') || '[PPT 텍스트를 추출할 수 없습니다]';
}

// ── 파일 처리 메인 ──

async function handleFiles(files) {
  if (!files || files.length === 0) return;

  const fpList = document.getElementById('fpList');
  const uploadMsg = document.getElementById('uploadMsg');
  fpList.innerHTML = '';
  fpList.classList.add('show');
  uploadMsg.className = 'msg';

  let successCount = 0, failCount = 0;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const ext = file.name.split('.').pop().toLowerCase();

    // 파일별 진행 UI 생성
    const itemId = `fp${i}`;
    fpList.innerHTML += `
      <div class="fp-item" id="${itemId}">
        <div class="fp-name">📄 ${file.name} <span style="font-size:10px;color:var(--t3);font-family:var(--mono)">(${(file.size/1024/1024).toFixed(1)}MB)</span></div>
        <div class="fp-bar-wrap"><div class="fp-bar" id="${itemId}-bar"></div></div>
        <div class="fp-status" id="${itemId}-status">준비 중...</div>
      </div>`;

    const bar = () => document.getElementById(`${itemId}-bar`);
    const status = () => document.getElementById(`${itemId}-status`);

    // 크기 체크
    if (file.size > 20 * 1024 * 1024) {
      bar().style.width = '100%'; bar().classList.add('err');
      status().textContent = '❌ 20MB 초과 — 건너뜀'; status().classList.add('err');
      failCount++; continue;
    }

    // 형식 체크
    if (!['pdf','xlsx','xls','pptx','ppt'].includes(ext)) {
      bar().style.width = '100%'; bar().classList.add('err');
      status().textContent = `❌ 지원하지 않는 형식: .${ext}`; status().classList.add('err');
      failCount++; continue;
    }

    try {
      // 1. 텍스트 추출
      status().textContent = '📖 텍스트 추출 중...';
      bar().style.width = '20%';

      let extractedText = '';
      if (ext === 'pdf') {
        extractedText = await extractPdfText(file, pct => {
          bar().style.width = pct + '%';
        });
      } else if (['xlsx','xls'].includes(ext)) {
        bar().style.width = '40%';
        extractedText = await extractExcelText(file);
        bar().style.width = '80%';
      } else {
        bar().style.width = '40%';
        extractedText = await extractPptxText(file);
        bar().style.width = '80%';
      }

      // 50000자 제한
      if (extractedText.length > 50000) {
        extractedText = extractedText.slice(0, 50000) + '\n...[이하 생략]';
      }

      status().textContent = '☁️ 서버에 저장 중...';
      bar().style.width = '90%';

      // 2. 텍스트만 서버로 전송 (파일 크기 문제 해결!)
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          filename: file.name,
          ext,
          text: extractedText,
          size: file.size
        })
      });

      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || '서버 오류');

      bar().style.width = '100%'; bar().classList.add('done');
      status().textContent = `✅ 완료 — 텍스트 ${Math.round(extractedText.length/1000)}K자 추출됨`;
      status().classList.add('done');
      successCount++;

    } catch (e) {
      bar().style.width = '100%'; bar().classList.add('err');
      status().textContent = `❌ 실패: ${e.message}`; status().classList.add('err');
      failCount++;
    }
  }

  // 결과 메시지
  uploadMsg.className = 'msg show ' + (failCount === 0 ? 'ok' : 'err');
  if (successCount > 0 && failCount === 0) {
    uploadMsg.textContent = `✅ ${successCount}개 파일 업로드 완료! AI 분석에 즉시 반영됩니다.`;
  } else if (successCount > 0) {
    uploadMsg.textContent = `⚠ ${successCount}개 성공, ${failCount}개 실패.`;
  } else {
    uploadMsg.textContent = `❌ 모든 파일 업로드 실패. 오류 메시지를 확인하세요.`;
  }

  setTimeout(() => { uploadMsg.className = 'msg'; }, 6000);
  loadManuals();
}

// ── 매뉴얼 목록 ──

async function loadManuals() {
  try {
    const res = await fetch('/api/manuals');
    const data = await res.json();
    const list = document.getElementById('manualList');

    document.getElementById('statCount').textContent = (data.count || 0) + '개';
    const totalChars = (data.manuals || []).reduce((s, m) => s + (m.textLength || 0), 0);
    document.getElementById('statText').textContent =
      totalChars > 1000 ? Math.round(totalChars/1000) + 'K자' : totalChars + '자';
    document.getElementById('statStatus').textContent =
      (data.count || 0) > 0 ? '✅ 활성' : '⏸ 없음';

    if (!data.manuals || data.manuals.length === 0) {
      list.innerHTML = '<div class="manual-empty">등록된 매뉴얼이 없습니다.<br>위에서 파일을 업로드하세요.</div>';
      return;
    }

    const icons = { pdf:'📄', xlsx:'📊', xls:'📊', pptx:'📑', ppt:'📑' };
    list.innerHTML = data.manuals.map((m, i) => {
      const ext = (m.filename || '').split('.').pop().toLowerCase();
      const icon = icons[ext] || '📎';
      const date = m.uploadedAt ? new Date(m.uploadedAt).toLocaleDateString('ko-KR') : '-';
      const chars = m.textLength ? Math.round(m.textLength/1000) + 'K자' : '-';
      return `
        <div class="manual-item" id="mi${i}">
          <div class="manual-icon">${icon}</div>
          <div class="manual-info">
            <div class="manual-name">${m.filename || '알 수 없음'}</div>
            <div class="manual-meta">업로드: ${date} · 추출 텍스트: ${chars}</div>
          </div>
          <button class="btn-del" onclick="deleteManual('${m.pathname}','mi${i}')">삭제</button>
        </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('manualList').innerHTML =
      `<div class="manual-empty" style="color:var(--red)">목록 불러오기 실패: ${e.message}</div>`;
  }
}

async function deleteManual(pathname, elId) {
  if (!confirm('이 매뉴얼을 삭제하시겠습니까?')) return;
  try {
    const res = await fetch('/api/upload', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pathname })
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById(elId)?.remove();
      loadManuals();
    }
  } catch (e) { alert('삭제 실패: ' + e.message); }
}

loadManuals();
</script>
</body>
</html>
